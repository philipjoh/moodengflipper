<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moo Deng Flipper</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #2b1f3d 0%, #120a1c 60%, #05030a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #f5e9ff;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  h1 {
    margin: 0;
    font-size: 1.6em;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #ff8fd6, 0 0 4px #fff;
  }
  #hud {
    display: flex;
    align-items: center;
    gap: 26px;
    font-size: 1.1em;
    font-weight: bold;
  }
  #hud span { color: #ffd76e; }
  #tiltMeter {
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 1px;
  }
  #tiltMeter .bar {
    width: 96px;
    height: 12px;
    border-radius: 6px;
    background: #2a1c3f;
    box-shadow: inset 0 0 0 1px #4b3670;
    overflow: hidden;
  }
  #tiltFill {
    height: 100%;
    width: 0%;
    background: #8dff5f;
    transition: width 0.08s linear, background 0.15s linear;
  }
  #board {
    position: relative;
    border-radius: 18px;
    box-shadow: 0 0 0 6px #3a2a52, 0 0 30px 10px rgba(255, 140, 220, 0.35), inset 0 0 40px rgba(0,0,0,0.6);
  }
  canvas {
    display: block;
    border-radius: 12px;
    height: min(840px, calc(100vh - 185px));
    width: auto;
    background: linear-gradient(180deg, #1b1330 0%, #241a3d 60%, #150e26 100%);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5, 3, 10, 0.78);
    border-radius: 12px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 1.6em; color: #ff8fd6; }
  #overlay button {
    padding: 10px 22px;
    font-size: 1em;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: linear-gradient(180deg, #ff9fd8, #ff5fb0);
    color: #2a0a1a;
    cursor: pointer;
    box-shadow: 0 4px 0 #a5306e;
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a5306e; }
  #touchControls {
    display: none;
    align-items: center;
    gap: 18px;
  }
  #touchControls button {
    font-size: 0.9em;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    background: #3a2a52;
    color: #f5e9ff;
    box-shadow: 0 4px 0 #211730;
  }
  #touchControls > button {
    width: 96px;
    height: 64px;
  }
  #nudgePad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    gap: 6px;
  }
  #nudgePad button { height: 30px; }
  #btnLaunch { grid-column: 1 / -1; background: #6b3a86; }
  #instructions {
    font-size: 0.85em;
    opacity: 0.75;
    text-align: center;
  }
  @media (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>MOO DENG FLIPPER</h1>
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>BALLS <span id="lives">3</span></div>
    <div id="tiltMeter">TILT<div class="bar"><div id="tiltFill"></div></div></div>
  </div>
  <div id="board">
    <canvas id="game" width="500" height="840"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">Ready?</h2>
      <div id="overlaySub"></div>
      <button id="overlayBtn">Start Game</button>
    </div>
  </div>
  <div id="touchControls">
    <button id="btnLeft">◀ FLIP</button>
    <div id="nudgePad">
      <button id="btnNudgeL">◀</button>
      <button id="btnNudgeU">▲</button>
      <button id="btnNudgeR">▶</button>
      <button id="btnLaunch">LAUNCH</button>
    </div>
    <button id="btnRight">FLIP ▶</button>
  </div>
  <div id="instructions">
    A/← and D/→ flip &middot; hold SPACE and release to launch &middot; Q/W/E nudge the table<br>
    Nudge to save the ball &mdash; but fill the tilt meter and the flippers die
  </div>
</div>

    for (let i = 0; i < steps; i++) {

      const t1 = a0 + ((a1 - a0) * (i + 1)) / steps;
      segs.push({
        x1: cx + Math.cos(t0) * radius, y1: cy + Math.sin(t0) * radius,
        x2: cx + Math.cos(t1) * radius, y2: cy + Math.sin(t1) * radius,
        r,
      });
    }
    return segs;
  }

    const targets = [];

      targets.push({

        x2: x1 + (x2 - x1) * t1, y2: y1 + (y2 - y1) * t1,

    const target = f.active && !tilted ? f.activeAngle : f.restAngle;

    const prev = f.angle;
    if (f.angle > target) f.angle = Math.max(target, f.angle - step);
    else if (f.angle < target) f.angle = Math.min(target, f.angle + step);
    f.angVel = (f.angle - prev) / dt;

  function closestPointOnSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    return { x: x1 + t * dx, y: y1 + t * dy, t };
  }

  function resolveSegmentCollision(x1, y1, x2, y2, segR) {
    const cp = closestPointOnSegment(ball.x, ball.y, x1, y1, x2, y2);
    const dx = ball.x - cp.x, dy = ball.y - cp.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const minDist = BALL_RADIUS + segR;
    if (dist >= minDist) return false;
    const nx = dx / dist, ny = dy / dist;
    ball.x += nx * (minDist - dist);
    ball.y += ny * (minDist - dist);
    const vDotN = ball.vx * nx + ball.vy * ny;
    if (vDotN < 0) {
      ball.vx -= (1 + WALL_REST) * vDotN * nx;
      ball.vy -= (1 + WALL_REST) * vDotN * ny;
    }
    return true;

    if (dist >= minDist) return null;
    const nx = dx / dist, ny = dy / dist;
    ball.x += nx * (minDist - dist);
    ball.y += ny * (minDist - dist);
    const vDotN = ball.vx * nx + ball.vy * ny;
    if (vDotN < 0) {
      ball.vx -= (1 + restitution) * vDotN * nx;
      ball.vy -= (1 + restitution) * vDotN * ny;
    }
    return { nx, ny };
  }

  // Bumpers and slingshots ignore the incoming speed and fling the ball back out
  // along the contact normal at a fixed minimum rate.
  function kickOut(nx, ny, base) {
    const speed = Math.hypot(ball.vx, ball.vy);
    const out = Math.min(MAX_SPEED, Math.max(base, speed * 0.55 + base * 0.5));
    ball.vx = nx * out;
    ball.vy = ny * out;
  }

  function handleSlingshot(s) {
    const cp = closestPointOnSegment(ball.x, ball.y, s.a.x, s.a.y, s.b.x, s.b.y);
    const dx = ball.x - cp.x, dy = ball.y - cp.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const minDist = BALL_RADIUS + 8;
    if (dist >= minDist) return;
    const nx = dx / dist, ny = dy / dist;
    ball.x += nx * (minDist - dist);
    ball.y += ny * (minDist - dist);
    kickOut(nx, ny, SLING_KICK);
    s.hit = 0.12;
    addScore(25);
  }

  function handleFlipperCollision(f) {
    const tip = flipperTip(f);
    const cp = closestPointOnSegment(ball.x, ball.y, f.pivot.x, f.pivot.y, tip.x, tip.y);
    const dx = ball.x - cp.x, dy = ball.y - cp.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const minDist = BALL_RADIUS + FLIPPER_R;
    if (dist >= minDist) return;

    const nx = dx / dist, ny = dy / dist;
    ball.x += nx * (minDist - dist);
    ball.y += ny * (minDist - dist);

    // Bounce in the flipper's moving frame so a swinging flipper transfers its kick.
    const armLen = Math.hypot(cp.x - f.pivot.x, cp.y - f.pivot.y);
    const sx = f.side * -Math.sin(f.angle) * armLen * f.angVel;
    const sy = Math.cos(f.angle) * armLen * f.angVel;
    const rvx = ball.vx - sx, rvy = ball.vy - sy;
    const vDotN = rvx * nx + rvy * ny;
    if (vDotN < 0) {
      ball.vx = rvx - (1 + FLIPPER_REST) * vDotN * nx + sx;
      ball.vy = rvy - (1 + FLIPPER_REST) * vDotN * ny + sy;
    }
  }

  function plungerTopY() {
    return PLUNGER_REST_Y + plungerCharge * PLUNGER_TRAVEL;
  }

  function parkBallOnPlunger() {
    ballInLane = true;
    plungerCharge = 0;
    ball.x = LANE_CENTER;
    ball.y = PLUNGER_REST_Y - BALL_RADIUS;
    ball.vx = 0;
    ball.vy = 0;
    ball.lean = 0;
  }

  function releasePlunger() {
    plungerHeld = false;
    if (!running || !ballInLane) {
      plungerCharge = 0;
      return;
    }
    ball.y = PLUNGER_REST_Y - BALL_RADIUS;
    ball.vy = -(PLUNGER_MIN + plungerCharge * (PLUNGER_MAX - PLUNGER_MIN));
    ball.vx = (Math.random() - 0.5) * 30;
    ballInLane = false;
    plungerCharge = 0;
  }

  function nudge(dx, dy) {
    if (!running || serving || tilted || ballInLane || tiltCooldown > 0) return;
    ball.vx += dx * NUDGE_VX;
    ball.vy += dy * NUDGE_VY;
    // The cabinet lurches the other way, so the ball appears to lag behind.
    shake.vx -= dx * 220;
    shake.vy -= dy * 220;
    tiltCooldown = NUDGE_COOLDOWN;
    tiltMeter += NUDGE_COST;
    if (tiltMeter >= 1) {
      tiltMeter = 1;
      tilted = true;
      tiltFlash = 1.6;
      flippers.left.active = false;
      flippers.right.active = false;
    }
  }

  function updateShake(dt) {
    shake.vx += (-260 * shake.x - 14 * shake.vx) * dt;
    shake.vy += (-260 * shake.y - 14 * shake.vy) * dt;
    shake.x += shake.vx * dt;
    shake.y += shake.vy * dt;
  }

  function loseLife() {
    lives--;
    livesEl.textContent = lives;
    tilted = false;
    tiltMeter = 0;
    tiltFlash = 0;
    if (lives <= 0) {
      running = false;
      overlayTitle.textContent = 'Game Over';
      overlaySub.textContent = `Final score: ${score}`;
      overlayBtn.textContent = 'Play Again';
      overlay.classList.add('show');
      return;
    }
    serving = true;
    serveTimer = 0.8;
  }

  function addScore(n) {
    if (tilted) return;
    score += n;
    scoreEl.textContent = score;
  }

  function updateTimers(dt) {
    for (const b of bumpers) if (b.hit > 0) b.hit -= dt;
    for (const p of posts) if (p.hit > 0) p.hit -= dt;
    for (const s of slingshots) if (s.hit > 0) s.hit -= dt;
    for (const bank of banks) {
      for (const t of bank.targets) if (t.hit > 0) t.hit -= dt;
      if (bank.resetTimer > 0) {
        bank.resetTimer -= dt;
        if (bank.resetTimer <= 0) for (const t of bank.targets) t.down = false;
      }
    }
    if (tiltCooldown > 0) tiltCooldown -= dt;
    if (tiltFlash > 0) tiltFlash -= dt;
    if (!tilted && tiltMeter > 0) tiltMeter = Math.max(0, tiltMeter - TILT_DECAY * dt);
  }

  function update(dt) {
    updateFlipper(flippers.left, dt);
    updateFlipper(flippers.right, dt);
    updateShake(dt);
    if (!running) return;

    updateTimers(dt);

    if (serving) {
      serveTimer -= dt;
      if (serveTimer <= 0) {
        parkBallOnPlunger();
        serving = false;
      }
      return;
    }

    if (ballInLane) {
      if (plungerHeld) plungerCharge = Math.min(1, plungerCharge + CHARGE_RATE * dt);
      ball.x = LANE_CENTER;
      ball.y = plungerTopY() - BALL_RADIUS;
      return;
    }

    ball.vy += GRAVITY * dt;

    const damp = 1 - DRAG * dt;
    ball.vx *= damp;
    ball.vy *= damp;

    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > MAX_SPEED) {
      ball.vx *= MAX_SPEED / speed;
      ball.vy *= MAX_SPEED / speed;
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Moo Deng leans into her travel direction instead of rolling like a ball.
    const targetLean = Math.max(-1, Math.min(1, ball.vx / 500)) * 0.4;
    ball.lean += (targetLean - ball.lean) * Math.min(1, 8 * dt);

    for (const wseg of staticWalls) {
      resolveSegmentCollision(wseg.x1, wseg.y1, wseg.x2, wseg.y2, wseg.r);
    }

    if (ball.vy > 0) {
      resolveSegmentCollision(laneGate.x1, laneGate.y1, laneGate.x2, laneGate.y2, laneGate.r);
    }

    for (const bank of banks) {
      if (bank.resetTimer > 0) continue;
      for (const t of bank.targets) {
        if (t.down) continue;
        if (resolveSegmentCollision(t.x1, t.y1, t.x2, t.y2, t.r)) {
          t.down = true;
          t.hit = 0.25;
          addScore(250);
        }
      }
      if (bank.targets.every((t) => t.down)) {
        addScore(2500);
        bank.resetTimer = 1.2;
      }
    }

    for (const s of slingshots) handleSlingshot(s);

    for (const b of bumpers) {
      const n = resolveCircleCollision(b.x, b.y, b.r, WALL_REST);
      if (!n) continue;
      kickOut(n.nx, n.ny, BUMPER_KICK);
      b.hit = 0.12;
      addScore(100);
    }

    for (const p of posts) {
      if (!resolveCircleCollision(p.x, p.y, p.r, POST_REST)) continue;
      p.hit = 0.1;
      addScore(10);
    }

    handleFlipperCollision(flippers.left);
    handleFlipperCollision(flippers.right);

    // A ball that finds its way back down the shooter lane lands on the plunger
    // instead of draining, so it just has to be launched again.
    if (ball.vy >= 0 && ball.x > LANE_X + 12 && ball.y + BALL_RADIUS >= PLUNGER_REST_Y) {
      parkBallOnPlunger();
      return;
    }

    if (ball.y - BALL_RADIUS > H) {
      loseLife();
    }
  }

  function drawFlipper(f) {
    const tip = flipperTip(f);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = tilted ? '#6f5a86' : '#ff8fd6';
    ctx.lineWidth = FLIPPER_R * 2;
    ctx.shadowColor = tilted ? '#000' : '#ff5fb0';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(f.pivot.x, f.pivot.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    ctx.restore();
  }

  function capsule(x1, y1, x2, y2, r, color, glow) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = r * 2;
    ctx.strokeStyle = color;
    if (glow) {
      ctx.shadowColor = glow;
      ctx.shadowBlur = 10;
    }
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function drawWalls() {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
    ctx.fillRect(LANE_X, 268, 482 - LANE_X, H - 268);
    ctx.restore();

    for (const w of staticWalls) capsule(w.x1, w.y1, w.x2, w.y2, w.r, '#5a3f7a');

    ctx.save();
    ctx.setLineDash([7, 7]);
    capsule(laneGate.x1, laneGate.y1, laneGate.x2, laneGate.y2, laneGate.r, '#7b5ea3');
    ctx.restore();
  }

  function drawBanks() {
    for (const bank of banks) {
      for (const t of bank.targets) {
        if (t.down) {
          capsule(t.x1, t.y1, t.x2, t.y2, 3, 'rgba(255, 159, 77, 0.25)');
        } else {
          capsule(t.x1, t.y1, t.x2, t.y2, t.r, t.hit > 0 ? '#ffffff' : '#ff9f4d', '#ff9f4d');
        }
      }
    }
  }

  function drawSlingshots() {
    for (const s of slingshots) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(s.a.x, s.a.y);
      ctx.lineTo(s.b.x, s.b.y);
      ctx.lineTo(s.c.x, s.c.y);
      ctx.closePath();
      ctx.fillStyle = '#4b3670';
      ctx.fill();
      ctx.restore();
      capsule(s.a.x, s.a.y, s.b.x, s.b.y, 8, s.hit > 0 ? '#ffffff' : '#ff8fd6', '#ff5fb0');
    }
  }

  function drawBumpers() {
    for (const b of bumpers) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + (b.hit > 0 ? 3 : 0), 0, Math.PI * 2);
      ctx.fillStyle = b.hit > 0 ? '#ffffff' : b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(20, 10, 32, 0.45)';
      ctx.shadowBlur = 0;
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPosts() {
    for (const p of posts) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.hit > 0 ? '#ffffff' : '#9b7fc4';
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPlunger() {
    const top = ballInLane ? plungerTopY() : PLUNGER_REST_Y;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#6f5a86';
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const y = top + 12 + i * 8;
      ctx.moveTo(LANE_CENTER - 12, y);
      ctx.lineTo(LANE_CENTER + 12, y);
    }
    ctx.stroke();

    ctx.fillStyle = '#d9c2ff';
    ctx.beginPath();
    ctx.roundRect(LANE_CENTER - 22, top - 2, 44, 12, 5);
    ctx.fill();
    ctx.restore();

    if (!ballInLane) return;

    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.beginPath();
    ctx.roundRect(60, 812, 300, 14, 7);
    ctx.fill();
    ctx.fillStyle = plungerCharge > 0.85 ? '#ff5fb0' : '#ffd76e';
    ctx.beginPath();
    ctx.roundRect(60, 812, Math.max(4, 300 * plungerCharge), 14, 7);
    ctx.fill();
    ctx.restore();
  }

  function drawBall() {
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.lean);
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    if (mooDengImg.complete && mooDengImg.naturalWidth > 0) {
      const h = BALL_RADIUS * 2.2;
      const w = h * (mooDengImg.naturalWidth / mooDengImg.naturalHeight);
      ctx.drawImage(mooDengImg, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = '#ff8fd6';
      ctx.beginPath();
      ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMessages() {
    if (tiltMeter > 0.6 || tiltFlash > 0) {
      const pulse = tilted ? 0.22 + 0.1 * Math.sin(performance.now() / 90) : (tiltMeter - 0.6) * 0.35;
      ctx.save();
      ctx.globalAlpha = Math.max(0, pulse);
      ctx.fillStyle = '#ff2f2f';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    ctx.save();
    ctx.textAlign = 'center';
    if (tilted) {
      ctx.fillStyle = '#ff5555';
      ctx.font = 'bold 68px "Segoe UI", Arial, sans-serif';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 24;
      ctx.fillText('TILT', 217, 430);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd0d0';
      ctx.font = 'bold 17px "Segoe UI", Arial, sans-serif';
      ctx.fillText('flippers dead until the ball drains', 217, 462);
    } else if (running && ballInLane) {
      ctx.fillStyle = '#ffd76e';
      ctx.font = 'bold 19px "Segoe UI", Arial, sans-serif';
      ctx.fillText('HOLD SPACE \u2014 RELEASE TO LAUNCH', 217, 700);
    }
    ctx.restore();
  }

  function syncTiltHud() {
    const pct = Math.round(tiltMeter * 100);
    if (pct === hudTilt) return;
    hudTilt = pct;
    tiltFill.style.width = `${pct}%`;
    tiltFill.style.background = tilted ? '#ff3b3b' : pct > 66 ? '#ffb347' : '#8dff5f';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(shake.x, shake.y);

    drawWalls();
    drawBanks();
    drawSlingshots();
    drawBumpers();
    drawPosts();
    drawPlunger();
    drawFlipper(flippers.left);
    drawFlipper(flippers.right);
    if (!serving) drawBall();

    ctx.restore();

    drawMessages();
    syncTiltHud();
  }

  let lastTime = 0;
  let accumulator = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    const frameTime = Math.min((now - lastTime) / 1000, 0.25);
    lastTime = now;
    accumulator += frameTime;

    let steps = 0;
    while (accumulator >= STEP && steps < MAX_STEPS_PER_FRAME) {
      update(STEP);
      accumulator -= STEP;
      steps++;
    }
    if (steps === MAX_STEPS_PER_FRAME) accumulator = 0;

    draw();
  }

  function setFlipperActive(side, active) {
    if (side === 'left') flippers.left.active = active;
    else flippers.right.active = active;
  }

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') setFlipperActive('left', true);
    if (k === 'arrowright' || k === 'd') setFlipperActive('right', true);
    if (k === 'q') nudge(-1, 0);
    if (k === 'e') nudge(1, 0);
    if (k === 'w' || k === 'arrowup') nudge(0, -1);
    if (k === ' ' || k === 'spacebar') {
      e.preventDefault();
      plungerHeld = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') setFlipperActive('left', false);
    if (k === 'arrowright' || k === 'd') setFlipperActive('right', false);
    if (k === ' ' || k === 'spacebar') {
      e.preventDefault();
      releasePlunger();
    }
  });

  function bindHold(el, onPress, onRelease) {
    const on = (ev) => { ev.preventDefault(); onPress(); };
    const off = (ev) => { ev.preventDefault(); onRelease(); };
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off);
  }

  function bindTap(el, action) {
    const on = (ev) => { ev.preventDefault(); action(); };
    el.addEventListener('mousedown', on);
    el.addEventListener('touchstart', on, { passive: false });
  }

  bindHold(
    document.getElementById('btnLeft'),
    () => setFlipperActive('left', true),
    () => setFlipperActive('left', false),
  );
  bindHold(
    document.getElementById('btnRight'),
    () => setFlipperActive('right', true),
    () => setFlipperActive('right', false),
  );
  bindHold(
    document.getElementById('btnLaunch'),
    () => { plungerHeld = true; },
    releasePlunger,
  );
  bindTap(document.getElementById('btnNudgeL'), () => nudge(-1, 0));
  bindTap(document.getElementById('btnNudgeR'), () => nudge(1, 0));
  bindTap(document.getElementById('btnNudgeU'), () => nudge(0, -1));

  function startGame() {
    score = 0;
    lives = 3;
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    for (const b of bumpers) b.hit = 0;
    for (const p of posts) p.hit = 0;
    for (const s of slingshots) s.hit = 0;
    for (const bank of banks) {
      bank.resetTimer = 0;
      for (const t of bank.targets) { t.down = false; t.hit = 0; }
    }
    tilted = false;
    tiltMeter = 0;
    tiltCooldown = 0;
    tiltFlash = 0;
    plungerHeld = false;
    shake.x = shake.y = shake.vx = shake.vy = 0;
    parkBallOnPlunger();
    serving = false;
    serveTimer = 0;
    running = true;
    overlay.classList.remove('show');
  }

  overlayBtn.addEventListener('click', startGame);
  overlayTitle.textContent = 'Moo Deng Flipper';
  overlaySub.textContent = 'Launch her up the lane, then keep her off the drain!';
  overlay.classList.add('show');

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
